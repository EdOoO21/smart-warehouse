name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Prepare scripts
        run: chmod +x scripts/*.sh scripts/*.py

      - name: Build
        run: go build ./cmd/smart-warehouse

      - name: Unit tests
        run: go test ./...

      - name: Docker compose build
        run: docker compose build

      - name: Start environment
        run: docker compose up -d

      - name: Integration test
        run: ./scripts/integration-test.sh

      - name: E2E test
        run: ./scripts/e2e-test.sh

      - name: Load test
        run: |
          mkdir -p artifacts
          docker run --rm --network host -e BASE_URL=http://127.0.0.1:8082 -v "$PWD:/workspace" -w /workspace grafana/k6:0.55.0 run --summary-export artifacts/k6-summary.json load/k6.js

      - name: Metrics and SLI check
        run: |
          mkdir -p artifacts
          ./scripts/check-metrics.py | tee artifacts/sli-report.json

      - name: Alert rules check
        run: ./scripts/check-alerts.sh

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps > artifacts/docker-compose-ps.txt
          docker compose logs --no-color > artifacts/docker-compose.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw7-ci-artifacts
          path: artifacts/

      - name: Stop environment
        if: always()
        run: docker compose down -v
